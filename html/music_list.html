<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추천 리스트</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/music_list.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <header class="date-header">
            <i class="fas fa-caret-left arrow" id="prev-date"></i>
            <span id="today-date"></span>
            <i class="fas fa-caret-right arrow" id="next-date"></i>
        </header>

        <!-- 🔥 [추가] 전체 재생 버튼: 날짜 헤더 아래, 노래 리스트 위 -->
        <div class="play-all-row">
            <button id="play-all-btn" class="play-all-btn" type="button">
                <i class="fas fa-play"></i>
                <span>전체 재생</span>
            </button>
        </div>

        <main id="song-list-container" class="scrollable-list"></main>

        <div class="bottom-sheet" id="bottomSheet">
            <div class="drag-handle" id="dragHandle"><div class="handle-bar"></div></div>
            <div class="group-content-area">
                <div class="group-header-text">참여 중인 그룹</div>
                <div id="real-group-list"></div>
            </div>
        </div>
        <!-- 댓글 모달 -->
        <div class="comment-modal-overlay" id="commentModalOverlay">
            <div class="comment-modal-box" id="commentModalBox">
                <div class="comment-modal-header">
                    <span class="comment-modal-title">댓글</span>
                    <button class="comment-modal-close" id="commentModalClose">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="comment-list-area" id="commentListArea">
                    <!-- 댓글 목록이 JS로 렌더링됨 -->
                </div>
                <div class="comment-input-area">
                    <input type="text" id="commentInput" placeholder="댓글을 입력하세요" maxlength="300">
                    <button id="commentSubmitBtn">등록</button>
                </div>
            </div>
        </div>

        <!-- 사이드바 컨테이너 부분 수정 -->
        <div class="side-bar-container">
            <div class="side-bar-content collapsed" id="sideBarContent">
                <!-- 캘린더 버튼 -->
                <button class="side-btn" onclick="location.href='calendar.html'">
                    <img src="../img/calendar-silhouette.png" alt="calendar" style="width: 24px; height: 24px;">
                </button>
                <!-- 친구 목록 버튼 (사람 아이콘) -->
                <button class="side-btn" onclick="location.href='friend_list.html'">
                    <img src="../img/people2.png" alt="friends" style="width: 24px; height: 24px;">
                </button>
                <!-- 마이페이지 버튼 (사람 1명 아이콘) -->
                <button class="side-btn" onclick="location.href='mypage.html'">
                    <img src="../img/user.png" alt="mypage" style="width: 24px; height: 24px;">
                </button>
            </div>
            <!-- 사이드바 토글 버튼 (메뉴 아이콘) -->
            <button class="side-btn toggle-btn" id="sideBarToggle">
                <img src="../img/menu.png" alt="menu" style="width: 24px; height: 24px;">
            </button>
        </div>

        <!-- 🔥 [추가] 미니 플레이어 바 (하단 고정, 비활성 시 숨김) -->
        <div class="mini-player" id="miniPlayer" aria-hidden="true">
            <div class="mini-player-thumb">
                <img id="miniPlayerThumb" src="" alt="">
            </div>
            <div class="mini-player-info">
                <div class="mini-player-title" id="miniPlayerTitle">곡 제목</div>
                <div class="mini-player-sub" id="miniPlayerSub">@user · 1 / 1</div>
            </div>
            <div class="mini-player-controls">
                <button class="mp-btn" id="mpPrevBtn" aria-label="이전 곡" type="button">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="mp-btn mp-btn-main" id="mpPlayPauseBtn" aria-label="재생/일시정지" type="button">
                    <i class="fas fa-pause" id="mpPlayPauseIcon"></i>
                </button>
                <button class="mp-btn" id="mpNextBtn" aria-label="다음 곡" type="button">
                    <i class="fas fa-step-forward"></i>
                </button>
                <button class="mp-btn mp-btn-close" id="mpCloseBtn" aria-label="닫기" type="button">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- 🔥 [추가] YouTube IFrame이 마운트될 숨겨진 컨테이너 -->
        <div id="yt-player-wrapper" aria-hidden="true">
            <div id="yt-player"></div>
        </div>
    </div>

    <!-- 🔥 [추가] YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- 스크립트 파일이 js 폴더 안에 있어야 합니다 -->
    <script src="../js/music_list.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-messaging-compat.js"></script>
</body>
</html>
