<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추천 리스트</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/music_list.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <header class="date-header">
            <i class="fas fa-caret-left arrow" id="prev-date"></i>
            <span id="today-date"></span>
            <i class="fas fa-caret-right arrow" id="next-date"></i>
        </header>
        
        <main id="song-list-container" class="scrollable-list"></main>

        <div class="bottom-sheet" id="bottomSheet">
            <div class="drag-handle" id="dragHandle"><div class="handle-bar"></div></div>
            <div class="group-content-area">
                <div class="group-header-text">참여 중인 그룹</div>
                <div id="real-group-list"></div>
            </div>
        </div>

        <!-- 사이드바 컨테이너 부분 수정 -->
        <div class="side-bar-container">
            <div class="side-bar-content collapsed" id="sideBarContent">
                <!-- 캘린더 버튼 -->
                <button class="side-btn" onclick="location.href='calendar.html'">
                    <img src="../img/calendar-silhouette.png" alt="calendar" style="width: 24px; height: 24px;">
                </button>
                <!-- 친구 목록 버튼 (사람 아이콘) -->
                <button class="side-btn" onclick="location.href='friend_list.html'">
                    <img src="../img/people2.png" alt="friends" style="width: 24px; height: 24px;">
                </button>
                <!-- 마이페이지 버튼 (사람 1명 아이콘) -->
                <button class="side-btn" onclick="location.href='mypage.html'">
                    <img src="../img/user.png" alt="mypage" style="width: 24px; height: 24px;">
                </button>
            </div>
            <!-- 사이드바 토글 버튼 (메뉴 아이콘) -->
            <button class="side-btn toggle-btn" id="sideBarToggle">
                <img src="../img/menu.png" alt="menu" style="width: 24px; height: 24px;">
            </button>
        </div>
    </div>

    <!-- 스크립트 파일이 js 폴더 안에 있어야 합니다 -->
    <script src="../js/music_list.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-messaging-compat.js"></script>
</body>
</html>
