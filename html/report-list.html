<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report List</title>
    <link rel="stylesheet" href="../css/report-list.css">
    <script src="../js/report-list.js" defer></script>
</head>
<body>
    <div class="app-container">
        
        <div class="top-fixed-section">
            <header class="header">
                <button class="back-button" aria-label="뒤로가기">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            </header>

            <div class="search-container">
                <input type="text" class="search-input" placeholder="검색하기">
                <button class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <details class="date-picker-menu">
                <summary class="date-summary">
                    <svg class="calendar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span class="date-text">2026-07</span>
                </summary>
                <div class="date-dropdown-lists">
                    <ul class="year-list">
                        <li>2024</li><li>2025</li><li class="selected">2026</li><li>2027</li>
                    </ul>
                    <ul class="month-list">
                        <li>05</li><li>06</li><li class="selected">07</li><li>08</li><li>09</li>
                    </ul>
                </div>
            </details>
        </div>

        <div class="report-list-content" id="reportGrid">
            
            <div class="year-group" id="year-2026">
                <h2 class="year-heading">2026</h2>
                <div class="grid-container">
                    <div class="grid-item has-image" style="background-image: url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=300&auto=format&fit=crop');">
                        <div class="item-footer">
                            <div class="report-title">나의 첫 보고서</div>
                            <div class="report-subtitle">7월 보고서</div>
                            <details class="more-menu">
                                <summary>...</summary>
                                <ul class="dropdown">
                                    <li class="menu-edit-title">제목 변경하기</li>
                                    <li class="menu-edit-cover">표지 변경하기</li>
                                    <li class="menu-show-details">세부사항</li>
                                </ul>
                            </details>
                        </div>
                    </div>
                    <script>
                        for(let i=0; i<4; i++) {
                            document.write(`
                            <div class="grid-item">
                                <div class="item-footer">
                                    <div class="report-title">새 보고서</div>
                                    <div class="report-subtitle">6월 보고서</div>
                                    <details class="more-menu">
                                        <summary>...</summary>
                                        <ul class="dropdown">
                                            <li class="menu-edit-title">제목 변경하기</li>
                                            <li class="menu-edit-cover">표지 변경하기</li>
                                            <li class="menu-show-details">세부사항</li>
                                        </ul>
                                    </details>
                                </div>
                            </div>`);
                        }
                    </script>
                </div>
            </div>

            <div class="year-group" id="year-2025">
                <h2 class="year-heading">2025</h2>
                <div class="grid-container">
                    <script>
                        for(let i=0; i<5; i++) {
                            document.write(`
                            <div class="grid-item">
                                <div class="item-footer">
                                    <div class="report-title">작년 보고서</div>
                                    <div class="report-subtitle">12월 보고서</div>
                                    <details class="more-menu">
                                        <summary>...</summary>
                                        <ul class="dropdown">
                                            <li class="menu-edit-title">제목 변경하기</li>
                                            <li class="menu-edit-cover">표지 변경하기</li>
                                            <li class="menu-show-details">세부사항</li>
                                        </ul>
                                    </details>
                                </div>
                            </div>`);
                        }
                    </script>
                </div>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="titleModal">
        <div class="modal-content">
            <h3>제목 변경하기</h3>
            <input type="text" id="titleInput" class="modal-input" placeholder="새 제목을 입력하세요">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('titleModal')">취소</button>
                <button class="btn-save" id="saveTitleBtn">변경</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="coverModal">
        <div class="modal-content">
            <h3>표지 변경하기</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">새로운 표지 이미지를 선택해주세요.</p>
            <input type="file" id="coverFileInput" accept="image/*" class="modal-file-input">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('coverModal')">취소</button>
                <button class="btn-save" id="saveCoverBtn">적용</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailsModal">
        <div class="modal-content">
            <h3>세부사항</h3>
            <div class="details-info">
                <p><strong>생성일:</strong> <span id="detailDate">2026-07-09</span></p>
                <p><strong>시간:</strong> <span id="detailTime">오후 3:52</span></p>
                <p><strong>파일 크기:</strong> <span id="detailSize">2.4 MB</span></p>
                <p><strong>포맷:</strong> JPG / PDF</p>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" style="width: 100%;" onclick="closeModal('detailsModal')">닫기</button>
            </div>
        </div>
    </div>
</body>
</html>
