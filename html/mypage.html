<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="stylesheet" href="../css/mypage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="mobile-container">
        <div class="back-button-row">
            <i class="fas fa-chevron-left back-to-main" id="backToMain"></i>
        </div>
        <section class="profile-section">
            <div class="user-info">
                <h2 id="displayId" style="margin-bottom: 0;">로드 중...</h2>
                <!-- 🔥 margin-top을 5px로 수정하여 닉네임과 적당한 간격을 두었습니다. -->
                <p id="displayLoginId" style="font-size: 13px; color: #868e96; margin-top: 5px; margin-bottom: 12px; font-weight: 500;">@아이디</p>
                <p id="displayStatus"></p>
            </div>
            <button id="editBtn" class="primary-btn black-btn">수정하기</button>
        </section>

        <div class="dday-banner" id="ddayBanner" style="cursor: pointer;">
            <div id="ddayContent">
                <h1 class="dday-text">D-Day 설정 중</h1>
            </div>
            <div id="attendanceContent" class="hidden">
                <div class="scroll-wrapper">
                    <div id="contributionGrid" class="contribution-grid"></div>
                </div>
            </div>
        </div>

        <hr class="divider">

        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevWeek" class="nav-btn">&lt;</button>
                <h3 id="calendarMonth"></h3>
                <button id="nextWeek" class="nav-btn">&gt;</button>
            </div>
            <div class="week-display">
                <div class="day-labels">
                    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                </div>
                <div id="weekDays" class="days-container"></div>
            </div>
        </section>

        <hr class="divider">

        <section id="recommendationCard" class="info-card">
            <div class="card-inner">
                <a href="#" target="_blank" class="video-link" id="videoLink">
                    <div class="video-thumbnail">
                        <img src="" alt="Thumbnail" id="thumbImg">
                    </div>
                </a>
                
                <div class="info-box">
                    <p id="recommendMsg">노래 정보를 불러오는 중...</p>
                    <button id="editCommentBtn" class="edit-comment-btn" aria-label="한마디 수정" style="display:none;">
                        <img src="../img/pencil.png" alt="수정">
                    </button>
                </div>

                <div class="url-copy-box">
                    <input type="text" id="youtubeUrl" value="" readonly>
                    <button id="copyBtn" class="copy-link-text">복사</button>
                </div>
            </div>
        </section>
        <div class="logout-container">
            <button id="logout-btn" class="logout-btn">로그아웃</button>
        </div>
    </div>

    <!-- editModal 내부 수정[cite: 11] -->
    <div id="editModal" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="modal-header">
                <h2>프로필 수정</h2>
                <button class="close-edit-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <!-- editModal 내부 modal-body 부분 수정 -->
            <div class="modal-body">
                <div class="edit-row">
                    <label>닉네임</label>
                    <input type="text" id="editUsername" class="edit-input" placeholder="닉네임">
                </div>
                
                <div class="edit-row">
                    <label>아이디</label>
                    <input type="text" id="editLoginId" class="edit-input" placeholder="아이디">
                </div>
                
                <div class="edit-row">
                    <label>소개글</label>
                    <input type="text" id="editStatus" class="edit-input" placeholder="소개글">
                </div>
                <div class="edit-row">
                    <label>비공개</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="editPrivate" class="toggle-input">
                        <label for="editPrivate" class="toggle-label"></label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveBtn" class="confirm-btn">저장하기</button>
            </div>
        </div>
    </div>
    <div id="commentEditModal" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="modal-header">
                <h2>오늘의 한마디 수정</h2>
                <button class="close-comment-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div style="display: flex; flex-direction: column; text-align: left;">
                    <label style="font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px;">한마디</label>
                    <div style="position: relative;">
                        <textarea id="editComment" class="edit-input" maxlength="50"
                            placeholder="오늘의 한 마디를 남겨주세요"
                            style="width: 100%; box-sizing: border-box; resize: none; height: 90px; padding: 12px; padding-bottom: 32px; border: 1px solid #dbdbdb; border-radius: 10px; margin-bottom: 0; line-height: 1.5;"></textarea>
                        <div id="commentCharCount"
                            style="position: absolute; bottom: 12px; right: 15px; font-size: 12px; color: #888;">0 / 50자</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveCommentBtn" class="confirm-btn">저장하기</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="modal-header">
                <h2>알림</h2>
                <button class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p id="modalMsg">내용</p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn confirm-btn">확인</button>
            </div>
        </div>
    </div>

    <div id="logoutConfirmModal" class="modal hidden">
        <div class="modal-content">
            <p>정말 로그아웃 하시겠습니까?</p>
            <div class="modal-btn-group">
                <button id="logoutCancelBtn" class="cancel-btn">취소</button>
                <button id="logoutProceedBtn" class="confirm-btn proceed-btn">로그아웃</button>
            </div>
        </div>
    </div>
    <div class="mini-player" id="miniPlayer" aria-hidden="true">
            <div class="mini-player-header" id="mpHeader">
                <div class="mini-player-thumb">
                    <img id="miniPlayerThumb" src="" alt="">
                </div>
                <div class="mini-player-info">
                    <div class="mini-player-title" id="miniPlayerTitle">곡 제목</div>
                    <div class="mini-player-sub" id="miniPlayerSub">@user · 1 / 1</div>
                </div>
                <div class="mini-player-controls">
                    <button class="mp-btn" id="mpPrevBtn" aria-label="이전 곡" type="button"><i class="fas fa-step-backward"></i></button>
                    <button class="mp-btn mp-btn-main" id="mpPlayPauseBtn" aria-label="재생/일시정지" type="button"><i class="fas fa-pause" id="mpPlayPauseIcon"></i></button>
                    <button class="mp-btn" id="mpNextBtn" aria-label="다음 곡" type="button"><i class="fas fa-step-forward"></i></button>
                    <button class="mp-btn mp-btn-close" id="mpCloseBtn" aria-label="닫기" type="button"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="mini-player-body" id="mpBody">
                <div class="mp-video-container">
                    <div id="yt-player"></div>
                </div>
                <div class="mp-queue-header">다음 재생 목록</div>
                <div class="mp-queue-list" id="mpQueueList"></div>
            </div>
        </div>
        <div id="yt-player-wrapper" aria-hidden="true" style="position:fixed; width:1px; height:1px; overflow:hidden; z-index:-1; opacity:0;">
            <div id="yt-player"></div>
        </div>

        <script src="https://www.youtube.com/iframe_api"></script>

    <script src="../js/mypage.js"></script>
</body>
</html>
