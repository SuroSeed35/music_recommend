<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends List</title>
    <link rel="stylesheet" href="../css/friend_list.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="groupNameModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2>그룹 생성</h2>
                <button class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="groupNameInput" class="group-name-input" placeholder="그룹 이름을 입력하세요">
                <p id="selectedCountText" style="font-size: 13px; color: #666;"></p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel">취소</button>
                <button id="submitGroupFinal" class="modal-btn confirm">생성</button>
            </div>
        </div>
    </div>

    <div id="userProfileModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="profileName">유저 정보</h2>
                <button class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" style="text-align: left;">
                <div class="profile-info-item"><strong>소개:</strong> <span id="profileBio"></span></div>
                <div class="profile-info-item"><strong>D-Day:</strong> <span id="profileDday"></span></div>
                <hr class="divider">
                <p style="font-weight: 700; margin-bottom: 10px;">오늘의 노래</p>
                <a id="songLink" href="#" target="_blank" class="song-recommend-box">
                    <div class="song-thumbnail">
                        <img id="songThumbImg" src="" alt="thumbnail">
                    </div>
                    <div class="song-info">
                        <div id="songName" class="song-title">곡 제목</div>
                        <div class="song-sub">YouTube에서 보기</div>
                    </div>
                </a>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel">닫기</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modalTitle">확인</h2>
                <button class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
            </div>
            <div class="modal-footer">
                <button id="addCancelBtn" class="modal-btn cancel">취소</button>
                <button id="addConfirmBtn" class="modal-btn confirm">예</button>
            </div>
        </div>
    </div>

    <div class="mobile-container">
        <!-- friend_list.html 상단에 추가 -->
        <header class="friend-header">
            <div class="back-button-row">
                <!-- 클릭 시 메인으로 이동할 화살표 버튼 -->
                <i class="fas fa-chevron-left back-to-main" id="backToMain"></i>
            </div>
        </header>
        <header>
            <h1 class="main-title">친구 목록</h1>
            <div class="header-controls" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                <button id="mainToggleBtn" class="add-friend-btn">
                    <i class="fa-solid fa-plus"></i> <span class="btn-text">친구 추가 하기</span>
                </button>
                <button id="groupToggleBtn" class="add-friend-btn">
                    <i class="fa-solid fa-plus"></i> <span class="group-btn-text">그룹 추가 하기</span>
                </button>
            </div>
        </header>

        <main id="listView" class="view-section active-view">
            <section class="friend-section">
                <div class="section-title toggle-btn"><i class="fa-solid fa-chevron-down arrow"></i> 친구 신청 목록</div>
                <div class="list-container collapsible-content" id="requestListContainer"></div>
            </section>
            <hr class="divider">
            <section class="friend-section">
                <div class="section-title toggle-btn"><i class="fa-solid fa-chevron-down arrow"></i> 그룹 초대 목록</div>
                <div class="list-container collapsible-content" id="groupInviteListContainer"></div>
            </section>
            <hr class="divider">
            <section class="friend-section">
                <div class="section-title toggle-btn"><i class="fa-solid fa-chevron-down arrow"></i> 그룹 목록</div>
                <div class="list-container collapsible-content" id="groupListContainer"></div>
            </section>
            <hr class="divider">
            <section class="friend-section">
                <div class="list-container" id="friendMainList"></div>
            </section>
            <hr class="divider">
        </main>

        <main id="addView" class="view-section" style="display: none;">
            <div class="search-section">
                <input type="text" class="search-input" id="friendSearchInput" placeholder="아이디 또는 이름 입력 후 Enter" style="width: 100%;">
            </div>
            <div class="list-container" id="searchResultList"></div>
        </main>
        
        <main id="groupAddView" class="view-section" style="display: none;">
            <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 15px;">그룹에 추가할 친구를 선택하세요</p>
            <div class="list-container" id="groupSelectionList"></div>
        </main>
    </div>

    <div class="floating-btn-container" id="groupFloatContainer" style="display: none;">
        <button id="openGroupNameModal" class="create-group-btn">그룹 생성하기</button>
    </div>

    <div id="groupManageModal" class="modal-overlay" style="display: none; z-index: 1000;">
        <div class="modal-container" style="border-radius: 8px;">
            <div class="modal-header">
                <h2>그룹 관리</h2>
                <button class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" style="text-align: left; padding: 10px 15px;">
                <input type="hidden" id="manageGroupId">
                <input type="hidden" id="manageGroupRole">
                <input type="hidden" id="manageGroupCount">
                
                <div id="adminOnlySection" style="display: none;">
                    <div style="margin-bottom: 20px;">
                        <label style="font-weight: bold; font-size: 13px; color: #555; display: block; margin-bottom: 8px;">그룹 이름 수정</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" id="manageGroupName" placeholder="새 그룹 이름" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; box-sizing: border-box;">
                            <button id="updateGroupBtn" style="width: 65px; background-color: #333; color: white; border: none; border-radius: 4px; font-size: 13px; cursor: pointer;">수정</button>
                        </div>
                    </div>

                    <hr class="divider" style="margin: 15px 0;">

                    <div style="margin-bottom: 20px;">
                        <label style="font-weight: bold; font-size: 13px; color: #555; display: block; margin-bottom: 8px;">멤버 초대</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" id="inviteMemberName" placeholder="초대할 유저 검색" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; box-sizing: border-box;">
                            <button id="searchInviteMemberBtn" style="width: 65px; background-color: #333; color: white; border: none; border-radius: 4px; font-size: 13px; cursor: pointer;">검색</button>
                        </div>
                        <div id="inviteSearchResult" style="margin-top: 10px; max-height: 140px; overflow-y: auto;"></div>
                    </div>

                    <hr class="divider" style="margin: 15px 0;">
                </div>

                <div style="text-align: center; margin-top: 10px; margin-bottom: 10px;">
                    <button id="deleteGroupBtn" style="width: 100%; padding: 12px; background-color: #ff4d4f; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer;">이 그룹 나가기</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" style="border-radius: 4px;">닫기</button>
            </div>
        </div>
    </div>

    <div id="delegateAdminModal" class="modal-overlay" style="display: none; z-index: 1001;">
        <div class="modal-container" style="border-radius: 8px;">
            <div class="modal-header">
                <h2>방장 위임하기</h2>
                <button class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" style="padding: 15px;">
                <p style="font-size: 13px; margin-bottom: 15px; color: #555;">그룹을 나가기 전 새 방장을 지정해주세요.</p>
                <select id="newAdminSelect" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; box-sizing: border-box;"></select>
                <button id="confirmDelegateAndLeaveBtn" style="width: 100%; padding: 12px; background-color: #ff4d4f; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 15px;">위임하고 나가기</button>
            </div>
        </div>
    </div>

    <script src="../js/friend_list.js"></script>
</body>
</html>
