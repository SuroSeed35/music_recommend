<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <div class="container">
        <h1 class="welcome-title" id="typing-text"></h1>
        
        <form class="signup-form" id="signupForm">
            <!-- 1. 이메일 입력 + 인증 버튼 -->
            <div class="input-group">
                <label>이메일</label>
                <div class="email-row">
                    <input type="email" name="email" id="emailInput" placeholder="이메일을 입력하세요" required>
                    <button type="button" id="sendCodeBtn" class="verify-btn">인증</button>
                </div>
                <div id="emailStatus" class="status-msg"></div>
            </div>

            <!-- 1-2. 인증 코드 입력 (초기엔 숨김) -->
            <div class="input-group code-group" id="codeSection" hidden>
                <label>인증 코드</label>
                <div class="email-row">
                    <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="6자리 숫자">
                    <button type="button" id="verifyCodeBtn" class="verify-btn">확인</button>
                </div>
                <div class="code-meta">
                    <span id="timerText" class="timer-text"></span>
                    <button type="button" id="resendBtn" class="link-btn" disabled>재전송</button>
                </div>
                <div id="codeStatus" class="status-msg"></div>
            </div>

            <div class="input-group">
                <label>닉네임</label>
                <input type="text" name="username" placeholder="사용할 닉네임을 입력하세요" required>
            </div>


            <!-- 2. 아이디 입력 (영문/숫자 제한 추가) -->
            <!-- 2. 아이디 입력 (영문/숫자/언더바/점 제한 추가) -->
            <div class="input-group">
                <label>아이디</label>
                <input type="text" 
                       name="login_id" 
                       placeholder="영문, 숫자, 언더바(_), 점(.)만 입력" 
                       pattern="^[a-zA-Z0-9_.]+$" 
                       title="아이디는 영문, 숫자, 언더바(_), 점(.)만 입력 가능합니다."
                       required>
            </div>

            <!-- 4. 비밀번호 입력 (보안 규칙 추가) -->
            <div class="input-group">
                <label>비밀번호</label>
                <input type="password" 
                       name="password" 
                       placeholder="영문, 숫자, 특수문자 포함 8자 이상" 
                       pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$"
                       title="비밀번호는 영문, 숫자, 특수문자를 포함하여 8자 이상이어야 합니다."
                       required>
            </div>
            <div id="signup-error" class="error-text"></div>
            <button type="submit" class="submit-btn" id="submitBtn" disabled>회원가입 하기</button>
        </form>

        <div class="footer-links">
            <p>이미 계정이 있으신가요? <a href="../html/login.html">로그인하러가기</a></p>
        </div>
    </div>
    <script src="../js/script.js?v=1"></script>
</body>
</html>
