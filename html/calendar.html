<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인-캘린더</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <header class="calendar-header-container">
            <div class="back-button-row">
                <i class="fas fa-chevron-left back-to-main" id="backToMain"></i>
            </div>
            
            <div class="month-control-row">
                <i id="prev-month" class="fas fa-chevron-left month-btn"></i>
                <span id="current-month-year"></span>
                <i id="next-month" class="fas fa-chevron-right month-btn"></i>
            </div>
        </header>

        <div class="weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>
        <hr class="separator">

        <div class="play-all-controls" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="switch">
                    <input type="checkbox" id="playAllSwitch">
                    <span class="slider round"></span>
                </label>
                <span id="playAllLabel" style="font-size: 14px; font-weight: bold;">날짜별 듣기</span>
            </div>
            <button id="playSelectedBtn" style="background: #000000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 500; cursor: pointer; color: white; font-size: 11px;">
                모아듣기
            </button>
        </div>

        <div id="periodModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center;">
            <div style="background: #fff; padding: 20px; border-radius: 16px; width: 85%; max-width: 350px; text-align: center; display: flex; flex-direction: column; max-height: 85vh; overflow: hidden;">
                
                <div id="modal-step-1" style="display: flex; flex-direction: column; height: 100%;">
                    <h3 style="margin-top: 0; margin-bottom: 15px; flex-shrink: 0; color: #111;">기간 선택</h3>
                    
                    <div class="modal-calendar-wrapper">
                        <div class="modal-calendar-header">
                            <i id="modal-prev-month" class="fas fa-chevron-left" style="cursor:pointer; padding:5px;"></i>
                            <span id="modal-month-year" style="font-weight: 800; font-size: 15px;"></span>
                            <i id="modal-next-month" class="fas fa-chevron-right" style="cursor:pointer; padding:5px;"></i>
                        </div>
                        <div class="modal-weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; font-weight: 700; color: #888; margin-bottom: 6px;">
                            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                        </div>
                        <div id="modal-calendar-grid" class="modal-calendar-grid"></div>
                    </div>

                    <div id="modal-selected-range" style="font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #555; padding: 8px; background: #f8f9fa; border-radius: 8px; margin-top: 10px;">
                        기간을 선택해주세요
                    </div>

                    <div style="display: flex; gap: 10px; flex-shrink: 0; margin-top: 5px;">
                        <button id="periodCancelBtn" style="flex: 1; padding: 12px; border: none; border-radius: 10px; background: #eee; cursor: pointer; font-weight: bold; color: #555;">취소</button>
                        <button id="periodNextBtn" style="flex: 1; padding: 12px; border: none; border-radius: 10px; background: #111; color: #fff; cursor: pointer; font-weight: bold;">다음</button>
                    </div>
                </div>

                <div id="modal-step-2" style="display: none; flex-direction: column; height: 100%;">
                    <h3 style="margin-top: 0; margin-bottom: 15px; flex-shrink: 0; color: #111;">선택된 음악 리스트</h3>
                    
                    <div id="periodPreviewList" style="flex: 1; text-align: left; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 15px; overflow-y: auto; max-height: 45vh;">
                    </div>

                    <div style="display: flex; gap: 10px; flex-shrink: 0; margin-top: auto;">
                        <button id="periodBackBtn" style="flex: 1; padding: 12px; border: none; border-radius: 10px; background: #eee; cursor: pointer; font-weight: bold; color: #555;">뒤로</button>
                        <button id="periodPlayBtn" style="flex: 1; padding: 12px; border: none; border-radius: 10px; background: #000000; color: #ffffff; cursor: pointer; font-weight: bold;">재생하기</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="mini-player" id="miniPlayer" aria-hidden="true">
            <div class="mini-player-header" id="mpHeader">
                <div class="mini-player-thumb">
                    <img id="miniPlayerThumb" src="" alt="">
                </div>
                <div class="mini-player-info">
                    <div class="mini-player-title" id="miniPlayerTitle">곡 제목</div>
                    <div class="mini-player-sub" id="miniPlayerSub">@user · 1 / 1</div>
                </div>
                <div class="mini-player-controls">
                    <button class="mp-btn" id="mpPrevBtn" type="button"><i class="fas fa-step-backward"></i></button>
                    <button class="mp-btn mp-btn-main" id="mpPlayPauseBtn" type="button"><i class="fas fa-pause" id="mpPlayPauseIcon"></i></button>
                    <button class="mp-btn" id="mpNextBtn" type="button"><i class="fas fa-step-forward"></i></button>
                    <button class="mp-btn mp-btn-close" id="mpCloseBtn" type="button"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="mini-player-body" id="mpBody">
                <div class="mp-video-container">
                    <div id="yt-player"></div>
                </div>
                <div class="mp-queue-header">다음 재생 목록</div>
                <div class="mp-queue-list" id="mpQueueList"></div>
            </div>
        </div>

        <div class="category-select-wrapper">
            <div id="current-category-name" class="current-category">전체</div>
            <i class="fas fa-chevron-down select-arrow"></i>
            
            <div id="category-dropdown" class="category-dropdown-menu">
            </div>
        </div>
        
        <div id="selected-song-list" class="song-card-container"></div>
    </div>
    
    <script src="../js/calendar.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
