<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Monthly Summary</title>
  <link rel="stylesheet" href="../css/report-detail.css">
</head>
<body>

  <div class="phone-container" id="phoneContainer">
    
    <!-- 상단 헤더 -->
    <div class="sticky-header-wrapper" id="stickyHeader">
      <div class="header">
        <!-- 💡 뒤로가기 버튼 ID 추가 -->
        <span class="back-btn" id="goBackBtn">&#60;</span>
        
        <!-- 더보기 버튼 & 드롭다운 -->
        <div class="more-options-container">
          <span class="more-btn" id="moreBtn">&#8943;</span>
          <div class="more-dropdown" id="moreDropdown">
            <div class="dropdown-item" id="editTitleBtn">제목 변경하기</div>
            <div class="dropdown-item" id="changeBgBtn">배경 변경하기</div>
          </div>
        </div>
      </div>

      <div class="title-area">
        <div class="main-title" id="mainTitleText"></div>
        <div class="created-date" id="createdDateText"></div>
      </div>
    </div>

    <!-- 배경 이미지 업로드를 위한 숨김 input -->
    <input type="file" id="bgFileInput" accept="image/*" style="display: none;">

    <div class="scroll-content">
      
      <!-- 1. Favorite Artist -->
      <div class="section animate-from-left">
        <div class="section-title-wrap">
          <span class="section-en-title">Favorite Artist</span>
          <span class="section-ko-title">이 달의 최애 아티스트</span>
        </div>
        <div class="card-box artist-card">
          <div class="artist-img-wrapper">
            <img class="artist-img" id="favArtistImg" src="../img/user-profile.jpg" alt="artist profile">
          </div>
          <div class="artist-info">
            <span class="artist-name" id="favArtistName">정보 없음</span>
            <span class="artist-handle" id="favArtistHandle">-</span>
          </div>
        </div>
      </div>

      <!-- 2. Most-played songs -->
      <div class="section align-right animate-from-right">
        <div class="section-title-wrap">
          <span class="section-en-title">Most-played songs</span>
          <span class="section-ko-title">이번 달 가장 많이 들은 노래</span>
        </div>
        <div class="song-wrapper">
          <div class="song-image-card">
            <img id="mostPlayedImg" src="../img/default-music.png" alt="Most-played song">
          </div>
          <div class="song-info">
            <span class="song-title" id="mostPlayedTitle">기록이 없습니다</span>
            <span class="song-channel" id="mostPlayedChannel">-</span>
          </div>
        </div>
      </div>

      <!-- 3. Most recommended time -->
      <div class="section animate-from-left">
        <div class="section-title-wrap">
          <span class="section-en-title">Most recommended time</span>
          <span class="section-ko-title">내가 가장 많이 추천한 시간대</span>
        </div>
        <div class="card-box chart-card">
          <!-- 💡 JS로 동적 제어할 수 있게 아이디 부여 -->
          <div class="bar-chart-container" id="barChartContainer">
            <!-- 24시간 바는 JS에서 자동 생성 및 높이 할당됨 -->
          </div>
          <div class="chart-labels">
            <span>00</span>
            <span>06</span>
            <span>12</span>
            <span>18</span>
            <span>24</span>
          </div>
        </div>
      </div>

      <!-- 4. Total likes this month -->
      <div class="section align-right animate-from-right">
        <div class="section-title-wrap">
          <span class="section-en-title">Total likes this month</span>
          <span class="section-ko-title">이번 달 좋아요 누른 개수</span>
        </div>
        
        <div class="card-box likes-card">
          <div class="likes-top">
            <span class="likes-count" id="totalLikesCount">0개</span>
          </div>
          <div class="likes-bottom">
            <div class="expand-btn" id="toggleListBtn">
              <span class="arrow-down"></span>
            </div>
          </div>
          
          <ul class="likes-details" id="expandableList">
            <!-- JS에서 DB 데이터로 동적 렌더링 됩니다. -->
          </ul>
        </div>
      </div>

    </div>
  </div>

  <!-- 제목 변경 모달창 -->
  <div class="modal-overlay" id="editTitleModal">
    <div class="modal-box">
      <h3>제목 변경</h3>
      <input type="text" id="newTitleInput" placeholder="새 제목을 입력하세요">
      <div class="modal-actions">
        <button class="modal-cancel" id="cancelEditBtn">취소</button>
        <button class="modal-save" id="saveTitleBtn">저장</button>
      </div>
    </div>
  </div>

  <!-- 배경 변경 모달창 -->
  <div class="modal-overlay" id="changeBgModal">
    <div class="modal-box">
      <h3>배경 이미지 변경</h3>
      <div class="bg-preview-area" id="bgPreviewArea">
        <span id="bgPreviewText">이미지를 선택해주세요</span>
      </div>
      <div class="modal-actions" style="margin-top: 10px;">
        <button class="modal-cancel" id="cancelBgBtn">취소</button>
        <button class="modal-save" style="background:#555;" id="selectBgFileBtn">이미지 찾기</button>
        <button class="modal-save" id="saveBgBtn">적용</button>
      </div>
    </div>
  </div>

  <script src="../js/report-detail.js"></script>
</body>
</html>
