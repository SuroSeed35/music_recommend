<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 노래 추천</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="main-container">
        <h2 class="title">오늘의 노래를<br>추천해주세요.</h2>
        <div class="content-section">
            <div class="input-card card">
                <div class="album-preview"><img src="" id="main-image"></div>
                <!-- 기존 코드에서 textarea 주변을 이렇게 수정해 주세요 -->
                <div class="input-group">
                    <!-- 글자 수 카운터를 위해 div로 한 번 묶어줍니다 -->
                    <div style="position: relative;">
                        <!-- 1. 타이핑하는 글자가 카운터에 가려지지 않게 padding-bottom: 30px; 을 추가합니다 -->
                        <textarea id="comment-input" placeholder="오늘의 한 마디를 남겨주세요" class="text-input" maxlength="50" style="padding-bottom: 30px;"></textarea>
                        
                        <!-- 2. position: absolute를 이용해 입력창 안쪽 우측 하단에 딱 붙여줍니다 -->
                        <div id="char-count" style="position: absolute; bottom: 12px; right: 16px; font-size: 12px; color: #888; background: transparent;">0 / 50자</div>
                    </div>
                    
                    <input type="text" id="url-input" placeholder="유튜브 URL을 입력하세요" class="text-input">
                </div>
                <!-- JS에서 이벤트를 처리하므로 onclick 속성을 제거함[cite: 7, 8] -->
                <button id="action-btn" class="submit-btn">이 노래로 추천하기</button>
            </div>
        </div>
    </div>

    <div id="duplicateModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center;">
            <div style="background: #fff; padding: 20px; border-radius: 16px; width: 85%; max-width: 350px; text-align: center; display: flex; flex-direction: column;">
                <h3 style="margin-top: 0; margin-bottom: 5px; color: #111;">이런, 이미 추천된 노래예요!</h3>
                <p style="font-size: 13px; color: #777; margin-bottom: 15px;">이전에 누군가 아래와 같이 추천한 적이 있습니다.</p>
                
                <div id="duplicateList" style="text-align: left; max-height: 180px; overflow-y: auto; background: #f8f9fa; border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 13px;">
                </div>

                <p style="font-size: 13px; font-weight: bold; color: #333; margin-bottom: 15px;">그래도 이 버전으로 등록하시겠어요?</p>

                <div style="display: flex; gap: 10px;">
                    <button id="dupCancelBtn" style="flex: 1; padding: 12px; border: none; border-radius: 10px; background: #eee; cursor: pointer; font-weight: bold; color: #555;">취소</button>
                    <button id="dupConfirmBtn" style="flex: 1; padding: 12px; border: none; border-radius: 10px; background: #111; color: #fff; cursor: pointer; font-weight: bold;">그대로 추천하기</button>
                </div>
            </div>
        </div>

    <script src="../js/main.js"></script>
</body>
</html>
